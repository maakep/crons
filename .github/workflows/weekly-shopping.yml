name: Weekly Shopping List

on:
  schedule:
    - cron: "0 12 * * 0"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node jobs/weekly-shopping.mjs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
